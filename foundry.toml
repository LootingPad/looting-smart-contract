[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# Only the deploy script's output directory is writable (spec 29).
fs_permissions = [{access = "read-write", path = "./deployments"}]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 32

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
